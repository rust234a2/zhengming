<svg viewBox="0 0 680 266" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>容器框的表达能力与盲区</title>
  <desc>两个议题框各自装着自己的论点，归属清晰；但框与框之间的关系无处安放，只能用问号标记这个盲区。</desc>
  <style>
    .th { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #5F5E5A; }
  </style>
  <text class="th" x="40" y="46">容器框</text>
  <text class="ts" x="40" y="64">归属清晰，关系无处安放</text>
  <rect x="40" y="80" width="260" height="140" rx="12" fill="#E6F1FB" fill-opacity="0.4" stroke="#85B7EB" stroke-width="0.5"/>
  <rect x="58" y="100" width="110" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="178" y="100" width="104" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="58" y="142" width="150" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="58" y="184" width="110" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="42" y="74">议题 A</text>
  <rect x="380" y="80" width="260" height="140" rx="12" fill="#FCEBEB" fill-opacity="0.4" stroke="#F09595" stroke-width="0.5"/>
  <rect x="398" y="100" width="110" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="518" y="100" width="104" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="398" y="142" width="150" height="28" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="382" y="74">议题 B</text>
  <line x1="302" y1="150" x2="378" y2="150" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <circle cx="340" cy="150" r="9" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">?</text>
  <text class="ts" x="40" y="248">只借它的边框语言（即凸包）— 关系仍然必须用线表达</text>
</svg>
