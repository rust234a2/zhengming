<script>
'use strict';
/* ================= 数据层 ================= */

const tree = {
  id:'root', type:'root', stance:'root',
  text:'43岁县中教师考上苏州公办校，该不该辞职去？',
  author:'知乎问题', votes:{up:128,down:9},
  source:{url:'https://www.zhihu.com/question/example-43', quote:'43岁，县中高级教师，考上了苏州公办校，纠结要不要放弃编制去苏州……'},
  children:[
    { id:'p1', type:'claim', stance:'pro', author:'知乎用户_2v8f',

      source:{url:'https://www.zhihu.com/question/example-43/answer/1', quote:'苏州的教研资源和培训机会确实多，但竞争也激烈……'},
      children:[

      votes:{up:35,down:11},
      children:[

          text:'「最后窗口」的判断依据是什么？很多地方 45 岁前都可调动，这个期限是否被夸大了？',

      ]},
    { id:'p3', type:'claim', stance:'pro', author:'知乎用户_8u3o',
      text:'子女教育资源是硬升级，这一代人的投入换下一代人的起点。',
      votes:{up:51,down:8}, children:[] },
    { id:'c1', type:'claim', stance:'con', author:'知乎用户_5y9i',
      text:'43 岁正是家庭牵绊最重的年纪，异地调动的隐性成本被系统性低估。',
      evidence:'父母养老、配偶工作、孩子转学三重成本叠加',
      votes:{up:47,down:5},
      agentHint:'「系统性低估」需要论证：哪些成本被低估、低估多少——这是可以追问的点',
      children:[
        { id:'c1a', type:'claim', stance:'pro', author:'知乎用户_6t0p',
          text:'这些成本可以用钱解决，而平台差距用钱买不来。',
          votes:{up:9,down:14}, children:[] }
      ]},
    { id:'c2', type:'claim', stance:'con', author:'知乎用户_3r7q',
      text:'备案制还是编内没写清，政策风险没人兜底，去了可能留不住。',
      votes:{up:23,down:4},
      source:{url:'https://www.zhihu.com/question/example-43/answer/2', quote:'苏州部分公办校新招教师是备案制，待遇和编内有差距……'},
      children:[] },
    { id:'n1', type:'claim', stance:'neu', author:'知乎用户_0a4s',
      text:'关键看苏州给的是编内还是备案制——这是两个完全不同的决策。',
      votes:{up:38,down:2},
      children:[
        { id:'n1a', type:'claim', stance:'neu', author:'知乎用户_2m8k',
          text:'还要看到手收入结构：绩效占比高的学校，编制的意义会被稀释。',
          votes:{up:12,down:1}, children:[] }
      ]},
    { id:'n2', type:'claim', stance:'neu', author:'知乎用户_7f3g',
      text:'取决于家庭是否随迁：单职工家庭和小家庭会得出相反结论。',
      votes:{up:27,down:3}, children:[] }
  ]
};

/* 索引（parentOf 只存 id 字符串——历史 bug：存对象导致查表崩溃） */
const byId = {};
const parentOf = {};
const depthOf = {};
const expanded = new Set();
let selectedId = null;
let uid = 100;

function register(n, pid, depth){
  byId[n.id] = n;
  parentOf[n.id] = pid;
  depthOf[n.id] = depth;
  (n.children || []).forEach(function(c){ register(c, n.id, depth + 1); });
}
register(tree, null, 0);

const DEPTH_MAX = 4, CHILD_MAX = 8, QUESTION_MAX = 3;
const TREE_SCHEMA_VERSION = 1;
const TREE_STORAGE_KEY = 'zhengming.debateTree.v1';
let revision = 0;

function cloneJson(value){ return JSON.parse(JSON.stringify(value)); }

function migrateTreeDocument(input){
  if (!input || typeof input !== 'object') return null;
  if (input.schemaVersion === TREE_SCHEMA_VERSION) return cloneJson(input);
  if (input.id === 'root'){
    return { schemaVersion:TREE_SCHEMA_VERSION, revision:0, tree:cloneJson(input), expanded:[] };
  }
  return null;
}

function validateTreeDocument(input){
  const doc = migrateTreeDocument(input);
  const errors = [];
  if (!doc){ return { ok:false, errors:['不支持的辩论树文档'] }; }
  if (!Number.isInteger(doc.revision) || doc.revision < 0) errors.push('revision 必须是非负整数');
  if (!doc.tree || doc.tree.id !== 'root' || doc.tree.type !== 'root') errors.push('必须有且仅有一个 root');
  if (!Array.isArray(doc.expanded)) errors.push('expanded 必须是节点 id 数组');
  const ids = new Set();
  function walk(node, depth){
    if (!node || typeof node !== 'object') { errors.push('节点必须是对象'); return; }
    if (!node.id || ids.has(node.id)) errors.push('节点 id 缺失或重复: ' + (node.id || '(empty)'));
    ids.add(node.id);
    if (!['root','claim','question'].includes(node.type)) errors.push('未知节点类型: ' + node.type);
    if (depth > DEPTH_MAX) errors.push('节点深度超过 ' + DEPTH_MAX + ': ' + node.id);
    const children = Array.isArray(node.children) ? node.children : [];
    if (children.length > CHILD_MAX) errors.push('子节点超过 ' + CHILD_MAX + ': ' + node.id);
    if (children.filter(function(c){ return c && c.type === 'question'; }).length > QUESTION_MAX){
      errors.push('追问超过 ' + QUESTION_MAX + ': ' + node.id);
    }
    if (node.type === 'claim' && !['pro','con','neu'].includes(node.stance)) errors.push('claim 立场无效: ' + node.id);
    if (node.type === 'question' && typeof node.answered !== 'boolean') errors.push('question 缺少 answered: ' + node.id);
    children.forEach(function(child){ walk(child, depth + 1); });
  }
  if (doc.tree) walk(doc.tree, 0);
  (doc.expanded || []).forEach(function(id){ if (!ids.has(id)) errors.push('expanded 引用了不存在的节点: ' + id); });
  return { ok:errors.length === 0, errors:errors, document:doc };
}

function snapshotTree(){
  return { schemaVersion:TREE_SCHEMA_VERSION, revision:revision, tree:cloneJson(tree), expanded:Array.from(expanded) };
}

function rebuildIndexes(){
  Object.keys(byId).forEach(function(id){ delete byId[id]; });
  Object.keys(parentOf).forEach(function(id){ delete parentOf[id]; });
  Object.keys(depthOf).forEach(function(id){ delete depthOf[id]; });
  register(tree, null, 0);
}

function restoreTree(input){
  const checked = validateTreeDocument(input);
  if (!checked.ok) return checked;
  Object.keys(tree).forEach(function(key){ delete tree[key]; });
  Object.assign(tree, cloneJson(checked.document.tree));
  revision = checked.document.revision;
  expanded.clear();
  checked.document.expanded.forEach(function(id){ expanded.add(id); });
  rebuildIndexes();
  return { ok:true, document:snapshotTree() };
}

function createTreeRepository(storage, key){
  return {
    load:function(){
      const raw = storage && storage.getItem ? storage.getItem(key) : null;
      if (!raw) return { ok:true, document:null };
      try {
        const checked = validateTreeDocument(JSON.parse(raw));
        return checked.ok ? { ok:true, document:checked.document } : checked;
      } catch (_err) { return { ok:false, errors:['持久化数据不是合法 JSON'] }; }
    },
    save:function(doc, expectedRevision){
      const checked = validateTreeDocument(doc);
      if (!checked.ok) return checked;
      const current = this.load();
      if (!current.ok) return current;
      const actual = current.document ? current.document.revision : 0;
      if (expectedRevision !== actual){
        return { ok:false, conflict:true, errors:['revision 冲突'], actualRevision:actual };
      }
      const next = cloneJson(checked.document);
      next.revision = actual + 1;
      if (storage && storage.setItem) storage.setItem(key, JSON.stringify(next));
      return { ok:true, document:next };
    }
  };
}

function treeRepository(){
  return createTreeRepository(typeof window !== 'undefined' ? window.localStorage : null, TREE_STORAGE_KEY);
}

function persistTree(){
  const saved = treeRepository().save(snapshotTree(), revision);
  if (saved.ok) revision = saved.document.revision;
  return saved;
}

function loadPersistedTree(){
  const loaded = treeRepository().load();
  if (loaded.ok && loaded.document) return restoreTree(loaded.document);
  return loaded;
}

/* ================= 纯逻辑（可测试） ================= */

function countNodes(n){
  return 1 + (n.children || []).reduce(function(s, c){ return s + countNodes(c); }, 0);
}

function stanceStats(){
  const counts = { pro:0, neu:0, con:0 };
  tree.children.forEach(function(c){ if (counts[c.stance] !== undefined) counts[c.stance]++; });
  const total = counts.pro + counts.neu + counts.con;
  const max = Math.max(counts.pro, counts.neu, counts.con);
  return { counts:counts, total:total, maxPct: total ? max / total : 0 };
}

function isImbalanced(counts){
  const total = counts.pro + counts.neu + counts.con;
  return total > 0 && Math.max(counts.pro, counts.neu, counts.con) / total > 0.7;
}

function canAddChild(pid){
  const p = byId[pid];
  if (!p) return { ok:false, msg:'节点不存在' };
  if (depthOf[pid] + 1 > DEPTH_MAX) return { ok:false, msg:'该分支已到最深，建议另开分叉议题' };
  if ((p.children || []).length >= CHILD_MAX) return { ok:false, msg:'该节点回应已满，请收敛到已有分支' };
  return { ok:true };
}

function addClaim(pid, opts){
  const chk = canAddChild(pid);
  if (!chk.ok) return chk;
  const text = (opts.text || '').trim();
  if (text.length < 4) return { ok:false, msg:'论点太短，请把主张说清楚' };
  const node = {
    id:'u' + (++uid), type:'claim', stance:opts.stance,
    text:text, author:'我', votes:{up:0,down:0}, children:[]
  };
  if (opts.evidence && opts.evidence.trim()) node.evidence = opts.evidence.trim();
  byId[pid].children.push(node);
  register(node, pid, depthOf[pid] + 1);
  expanded.add(pid);
  persistTree();
  return { ok:true, node:node };
}

const PURE_STANCE = /^(我就是)?(不同意|反对|支持|赞同|说得好|顶一个?|扯|胡说)[!！。.~～]*$/;

function validQuestionText(t){
  t = (t || '').trim();
  if (t.length < 8) return { ok:false, msg:'追问太短，请指向你想追问的具体内容' };
  if (PURE_STANCE.test(t)) return { ok:false, msg:'纯表态不构成追问，请指出具体想追问哪一点' };
  return { ok:true };
}

function addQuestion(pid, text, author){
  const chk = canAddChild(pid);
  if (!chk.ok) return chk;
  const p = byId[pid];
  const qCount = (p.children || []).filter(function(c){ return c.type === 'question'; }).length;
  if (qCount >= QUESTION_MAX) return { ok:false, msg:'该节点追问已满，请先回应现有追问' };
  const v = validQuestionText(text);
  if (!v.ok) return v;
  const node = {
    id:'u' + (++uid), type:'question', stance:p.stance === 'root' ? 'neu' : p.stance,
    text:text.trim(), author:author || '我', answered:false, children:[]
  };
  p.children.push(node);
  register(node, pid, depthOf[pid] + 1);
  expanded.add(pid);
  persistTree();
  return { ok:true, node:node };
}

/* 回应追问：立场继承被追问论点的立场 */
function respondToQuestion(qid, opts){
  const q = byId[qid];
  if (!q || q.type !== 'question') return { ok:false, msg:'追问不存在' };
  const parentClaim = byId[parentOf[qid]];
  opts = Object.assign({}, opts, { stance: parentClaim && parentClaim.stance !== 'root' ? parentClaim.stance : 'neu' });
  const r = addClaim(qid, opts);
  if (r.ok){ q.answered = true; persistTree(); }
  return r;
}

function vote(id, dir){
  const n = byId[id];
  if (!n || !n.votes) return;
  if (dir > 0) n.votes.up++; else n.votes.down++;
  persistTree();
}

function toggleNode(id){
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  persistTree();
}

/* ================= 渲染层 ================= */

function el(id){ return document.getElementById(id); }

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const STANCE_NAME = { pro:'支持', neu:'看条件', con:'反对' };

function srcBadge(n){
  if (!n.source) return '';
  return '<span class="src-badge" onclick="event.stopPropagation();openSource(\'' + n.id + '\')">源自知乎回答 ↗</span>';
}

function voteHtml(n){
  const score = n.votes.up - n.votes.down;
  return '<span class="vote">' +
    '<button onclick="event.stopPropagation();doVote(\'' + n.id + '\',1)">▲</button>' +
    '<span class="n">' + score + '</span>' +
    '<button onclick="event.stopPropagation();doVote(\'' + n.id + '\',-1)">▼</button></span>';
}

function renderQuestion(q){
  let h = '<div class="q-bubble" data-id="' + q.id + '">' +
    '<span class="tag">追问</span>' + esc(q.text) +
    '<div class="meta"><span>' + esc(q.author) + '</span>';
  if (q.answered) h += '<span class="answered">已回应</span>';
  else h += '<button class="respond" onclick="event.stopPropagation();openRespond(\'' + q.id + '\')">回应</button>';
  h += '</div>';
  if (q.children && q.children.length && expanded.has(q.id)){
    h += '<div class="children">' + q.children.map(renderCard).join('') + '</div>';
  } else if (q.children && q.children.length){
    h += '<div class="meta"><button class="respond" onclick="event.stopPropagation();doToggle(\'' + q.id + '\')">展开 ' + q.children.length + ' 条回应 ▼</button></div>';
  }
  return h + '</div>';
}

function renderCard(n){
  const open = expanded.has(n.id);
  const kids = n.children || [];
  const qKids = kids.filter(function(c){ return c.type === 'question'; });
  const cKids = kids.filter(function(c){ return c.type === 'claim'; });
  let h = '<div class="card stance-' + n.stance + (open ? ' open' : '') + (selectedId === n.id ? ' selected' : '') + '" data-id="' + n.id + '">';
  h += '<div onclick="doToggle(\'' + n.id + '\')">';
  h += '<div class="txt">' + esc(n.text) + '</div>';
  h += '<div class="meta">' + voteHtml(n) + '<span>' + esc(n.author) + '</span>';
  if (n.evidence) h += '<span class="badge ev">依据</span>';
  h += srcBadge(n);
  if (qKids.some(function(q){ return !q.answered; })) h += '<span class="badge q">有追问待回应</span>';
  if (kids.length) h += '<span class="caret">' + (open ? '收起 ▲' : kids.length + ' 条回应 ▼') + '</span>';
  h += '</div></div>';
  h += '<div class="actions">' +
    '<button onclick="event.stopPropagation();openAddClaim(\'' + n.id + '\')">＋回应</button>' +
    '<button onclick="event.stopPropagation();openQuestion(\'' + n.id + '\')">追问</button>' +
    '</div>';
  if (open){
    h += '<div class="body">';
    if (n.evidence) h += '<div class="evidence"><b>依据 ·</b> ' + esc(n.evidence) + '</div>';
    if (n.agentHint){
      h += '<div class="agent-strip"><span>Agent 在听：' + esc(n.agentHint) + '</span>' +
        '<button class="btn" onclick="event.stopPropagation();openQuestion(\'' + n.id + '\',1)">以此追问</button></div>';
    }
    if (kids.length){
      h += '<div class="children">' + cKids.map(renderCard).join('') + qKids.map(renderQuestion).join('') + '</div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

function renderTopic(){
  const t = tree;
  el('topic').innerHTML =
    '<h1>' + esc(t.text) + '</h1>' +
    '<div class="meta">' + voteHtml(t) + '<span>' + esc(t.author) + '</span>' + srcBadge(t) +
    '<span>' + countNodes(t) + ' 个节点 · ' + tree.children.length + ' 个立场</span></div>';
}

function renderStats(){
  const s = stanceStats();
  const pct = function(k){ return s.total ? Math.round(s.counts[k] / s.total * 100) : 0; };
  const imbalanced = s.maxPct > 0.7;
  el('stats').innerHTML =
    '<div class="bar">' +
    '<i class="p" style="width:' + pct('pro') + '%"></i>' +
    '<i class="n" style="width:' + pct('neu') + '%"></i>' +
    '<i class="c" style="width:' + pct('con') + '%"></i></div>' +
    '<div class="legend">' +
    '<span><i class="dot p"></i>支持 <b>' + s.counts.pro + '</b></span>' +
    '<span><i class="dot n"></i>看条件 <b>' + s.counts.neu + '</b></span>' +
    '<span><i class="dot c"></i>反对 <b>' + s.counts.con + '</b></span>' +
    '<span>最大立场占比 <b>' + Math.round(s.maxPct * 100) + '%</b></span>' +
    '<span class="warn-chip' + (imbalanced ? ' on' : '') + '">失衡：该议题立场一边倒，建议补充少数派视角</span>' +
    '</div>';
}

function renderColumns(){
  const order = ['pro', 'neu', 'con'];
  el('columns').innerHTML = order.map(function(st){
    const kids = tree.children.filter(function(c){ return c.stance === st; }); /* 按内容顺序，不按票数 */
    return '<div class="col" data-stance="' + st + '">' +
      '<div class="col-head"><i class="dot ' + st[0] + '"></i>' + STANCE_NAME[st] +
      '<span class="cnt">' + kids.length + ' 个立场</span>' +
      '<button class="add" title="添加' + STANCE_NAME[st] + '论点" onclick="openAddClaim(\'root\',\'' + st + '\')">＋</button></div>' +
      (kids.length ? kids.map(renderCard).join('') : '<div style="font-size:12px;color:var(--sub);padding:8px 2px">还没有立场，来抢沙发</div>') +
      '</div>';
  }).join('');
}

function render(){ renderTopic(); renderStats(); renderColumns(); }

/* ================= 交互层 ================= */

function doToggle(id){
  selectedId = id;
  toggleNode(id);
  render();
}

function doVote(id, dir){
  vote(id, dir);
  render();
}

function openSource(id){
  const n = byId[id];
  if (n && n.source && typeof window !== 'undefined' && window.open) window.open(n.source.url, '_blank');
}

let toastTimer = null;
function toast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast on';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, 2400);
}

/* ---------- 弹窗 ---------- */

function showPanel(html){ el('panel').innerHTML = html; el('overlay').className = 'overlay on'; }
function closeModal(){ el('overlay').className = 'overlay'; el('panel').innerHTML = ''; }

function stanceRadios(name, preset, locked){
  return ['pro','neu','con'].map(function(st){
    const checked = st === preset ? ' checked' : '';
    const dis = locked && st !== preset ? ' disabled' : '';
    return '<label class="' + (locked ? 'locked' : '') + '"><input type="radio" name="' + name + '" value="' + st + '"' + checked + dis + '><span>' + STANCE_NAME[st] + '</span></label>';
  }).join('');
}

function openAddClaim(pid, presetStance){
  const chk = canAddChild(pid);
  if (!chk.ok){ toast(chk.msg); return; }
  const parent = byId[pid];
  const stance = presetStance || (parent.stance === 'root' ? 'pro' : parent.stance);
  showPanel(
    '<h3>添加论点</h3>' +
    '<div class="reply-to">回应：' + esc(parent.text) + '</div>' +
    '<div class="stance-row">' + stanceRadios('m-stance', stance, pid !== 'root' && !presetStance ? false : !!presetStance) + '</div>' +
    '<textarea id="m-text" placeholder="你的主张（一句话说清）"></textarea>' +
    '<input type="text" id="m-evidence" placeholder="依据（可选）：数据、经历、出处">' +
    '<div class="err" id="m-err"></div>' +
    '<div class="foot"><button class="btn-ghost" onclick="closeModal()">取消</button>' +
    '<button class="btn-primary" onclick="submitClaim(\'' + pid + '\')">发布</button></div>'
  );
}

function submitClaim(pid){
  const stanceEl = document.querySelector('input[name="m-stance"]:checked');
  const r = addClaim(pid, {
    stance: stanceEl ? stanceEl.value : 'neu',
    text: el('m-text').value,
    evidence: el('m-evidence').value
  });
  if (!r.ok){ const e = el('m-err'); e.textContent = r.msg; e.className = 'err on'; return; }
  closeModal();
  render();
}

function openQuestion(pid, fromHint){
  const chk = canAddChild(pid);
  if (!chk.ok){ toast(chk.msg); return; }
  const parent = byId[pid];
  if ((parent.children || []).filter(function(c){ return c.type === 'question'; }).length >= QUESTION_MAX){
    toast('该节点追问已满，请先回应现有追问'); return;
  }
  const draft = fromHint && parent.agentHint ? parent.agentHint : '';
  showPanel(
    '<h3>追问这个论点</h3>' +
    '<div class="reply-to">追问对象：' + esc(parent.text) + '</div>' +
    '<textarea id="m-text" placeholder="指出你想追问的具体内容（纯表态不构成追问）">' + esc(draft) + '</textarea>' +
    '<div class="err" id="m-err"></div>' +
    '<div class="foot"><button class="btn-ghost" onclick="closeModal()">取消</button>' +
    '<button class="btn-primary" onclick="submitQuestion(\'' + pid + '\')">发布追问</button></div>'
  );
}

function submitQuestion(pid){
  const r = addQuestion(pid, el('m-text').value);
  if (!r.ok){ const e = el('m-err'); e.textContent = r.msg; e.className = 'err on'; return; }
  byId[pid].agentHint = null; /* 追问已生成，建议条淡出 */
  closeModal();
  render();
}

function openRespond(qid){
  const q = byId[qid];
  const parentClaim = byId[parentOf[qid]];
  const stance = parentClaim && parentClaim.stance !== 'root' ? parentClaim.stance : 'neu';
  const chk = canAddChild(qid);
  if (!chk.ok){ toast(chk.msg); return; }
  showPanel(
    '<h3>回应追问（立场继承：' + STANCE_NAME[stance] + '）</h3>' +
    '<div class="reply-to">回应追问：' + esc(q.text) + '</div>' +
    '<textarea id="m-text" placeholder="你的回应"></textarea>' +
    '<input type="text" id="m-evidence" placeholder="依据（可选）">' +
    '<div class="err" id="m-err"></div>' +
    '<div class="foot"><button class="btn-ghost" onclick="closeModal()">取消</button>' +
    '<button class="btn-primary" onclick="submitRespond(\'' + qid + '\')">发布</button></div>'
  );
}

function submitRespond(qid){
  const r = respondToQuestion(qid, { text: el('m-text').value, evidence: el('m-evidence').value });
  if (!r.ok){ const e = el('m-err'); e.textContent = r.msg; e.className = 'err on'; return; }
  closeModal();
  render();
}

/* ================= 自测 ================= */

const FORBIDDEN = /谬误|错误|偷换/;

function selfTest(){
  const fails = [];
  /* 1. 索引完整 */
  if (Object.keys(byId).length !== countNodes(tree)) fails.push('索引不完整: byId=' + Object.keys(byId).length + ' nodes=' + countNodes(tree));
  /* 2. parentOf 全是字符串 id */
  Object.keys(parentOf).forEach(function(id){
    if (parentOf[id] !== null && typeof parentOf[id] !== 'string') fails.push('parentOf[' + id + '] 不是字符串');
  });
  /* 3-5. 深度/子数/追问上限 */
  (function walk(n){
    if (depthOf[n.id] > DEPTH_MAX) fails.push('深度超限: ' + n.id);
    if ((n.children || []).length > CHILD_MAX) fails.push('子节点超限: ' + n.id);
    if ((n.children || []).filter(function(c){ return c.type === 'question'; }).length > QUESTION_MAX) fails.push('追问超限: ' + n.id);
    (n.children || []).forEach(walk);
  })(tree);
  /* 6. Agent 文案红线 */
  (function walk(n){
    if (n.agentHint && FORBIDDEN.test(n.agentHint)) fails.push('Agent 文案含评判词: ' + n.id);
    (n.children || []).forEach(walk);
  })(tree);
  /* 7. DOM 渲染 */
  if (!el('topic').innerHTML) fails.push('议题卡未渲染');
  const cols = document.querySelectorAll('#columns .col');
  if (cols.length !== 3) fails.push('三栏未渲染: ' + cols.length);
  /* 8. 失衡判定逻辑（合成数据） */
  if (!isImbalanced({ pro:7, neu:1, con:1 })) fails.push('失衡判定失效(应判失衡)');
  if (isImbalanced({ pro:3, neu:2, con:2 })) fails.push('失衡判定失效(不应判失衡)');
  return fails;
}

function init(){
  loadPersistedTree();
  render();
  const fails = selfTest();
  const bar = el('testbar');
  if (fails.length){
    bar.className = 'testbar fail';
    bar.textContent = 'selfTest ✗ ' + fails.length + ' 项失败: ' + fails.join(' | ');
    if (typeof console !== 'undefined') console.error('selfTest fails:', fails);
  } else {
    bar.className = 'testbar';
    bar.textContent = 'selfTest ✓ 全部通过（索引/父引用/深度/子数/追问上限/文案红线/渲染/失衡判定）';
  }
}

if (typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('DOMContentLoaded', init);
}
</script>
