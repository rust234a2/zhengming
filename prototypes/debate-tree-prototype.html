<style>
:root{
  --blue:#056DE8; --blue-bg:#E8F1FF; --blue-soft:#F0F6FF;
  --ink:#121212; --sub:#8590a6; --line:#ebebeb; --page:#f6f6f6;
  --card:#ffffff; --neu:#a9aebc; --warn:#c96a00;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#fff;color:var(--ink);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none}
/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:20;background:#fff;
  height:52px;display:flex;align-items:center;padding:0 24px;gap:16px}
.logo{font-size:18px;font-weight:600;color:var(--blue);letter-spacing:1px}
.crumb{color:var(--sub);font-size:13px}
.crumb b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.btn{padding:7px 16px;border-radius:6px;font-size:13px;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0455c4}
.btn-ghost{color:var(--ink);background:#f6f7f9}
.btn-ghost:hover{background:#eceef2}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
/* ── 议题卡 ── */
.topic{max-width:1200px;margin:16px auto 0;padding:0 24px}
.topic-card{background:none;border:none;border-radius:0;padding:18px 10px}
.topic-tag{display:inline-block;font-size:12px;color:var(--blue);background:var(--blue-bg);
  border-radius:4px;padding:1px 8px;margin-bottom:8px}
.topic-title{font-size:19px;font-weight:600;line-height:1.45}
.topic-meta{margin-top:6px;font-size:12px;color:var(--sub)}
.topic-meta a{color:var(--sub)}
.stats{margin-top:14px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eee}
.bar .seg-pro{background:var(--blue)} .bar .seg-con{background:var(--ink)} .bar .seg-neu{background:#c3c8d4}
.legend{display:flex;gap:18px;margin-top:8px;font-size:12px;color:var(--sub);align-items:center}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.balance-warn{margin-left:auto;color:var(--warn);display:none}
.balance-warn.show{display:inline}
/* ── 主区 ── */
main{max-width:1200px;margin:14px auto 40px;padding:0 24px;display:flex;gap:16px;align-items:flex-start}
#tree-panel{flex:1.5;background:none;border:none;padding:14px 8px;min-width:0}
#detail{flex:1;position:sticky;top:68px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mcard{background:none;border:none;border-radius:0;padding:2px 8px 4px}
/* 知乎风：内缩分割线 */
#detail .mcard+.mcard{position:relative;padding-top:14px}
#detail .mcard+.mcard::before{content:'';position:absolute;top:0;left:8px;right:8px;height:1px;background:var(--line)}
.panel-title{font-size:13px;color:var(--sub);margin-bottom:12px;font-weight:500}
/* ── 树 ── */
.node-row{position:relative;padding-left:26px;margin:6px 0}
.node-row::before{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:var(--line)}
.node-row.last::before{height:30px;bottom:auto}
.node-row::after{content:'';position:absolute;left:2px;top:30px;width:16px;height:2px;background:var(--line)}
.node-row.root-row{padding-left:0}
.node-row.root-row::before,.node-row.root-row::after{display:none}
.node-card{position:relative;background:#f7f8fa;border:none;border-radius:8px;
  padding:10px 12px 9px 14px;cursor:pointer;transition:background .15s}
.node-card:hover{background:#f0f2f5}
.node-card.root:hover{background:var(--blue)}
.node-card.sel{background:#e8f3ff;box-shadow:none}
.node-card.root{background:var(--blue);color:#fff}
.node-card.root .n-text{font-size:15px;font-weight:600}
.node-card.root .n-meta,.node-card.root .n-tag{color:rgba(255,255,255,.75)}
.n-tag{display:inline-block;font-size:11px;border-radius:3px;padding:0 6px;margin-right:8px;color:#fff;vertical-align:1px}
.n-tag.pro{background:var(--blue)} .n-tag.con{background:var(--ink)}
.n-tag.neu{background:#a9aebc}
.n-tag.que{background:#fff;color:var(--blue);border:1px dashed var(--blue)}
.n-text{display:block;margin:3px 0 2px}
.n-evid{display:block;font-size:12px;color:var(--sub);background:var(--page);border-left:2px solid var(--line);
  border-radius:0 4px 4px 0;padding:4px 8px;margin:4px 0 2px;line-height:1.5}
.n-evid b{font-weight:600;color:#6b7484;margin-right:6px;font-size:11px}
.n-meta{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.n-votes{display:inline-flex;align-items:center;gap:2px}
.n-votes button{font-size:12px;color:var(--sub);padding:1px 4px;border-radius:4px}
.n-votes button:hover{background:var(--blue-bg);color:var(--blue)}
.n-votes button.on{color:var(--blue);font-weight:600}
.n-src{font-size:11px;color:#b0b8c8;background:#f7f8fa;border:none;border-radius:3px;padding:1px 6px;text-decoration:none}
.n-src:hover{color:var(--blue);border-color:var(--blue)}
.fold{font-size:11px;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:1px 7px;margin-left:8px}
.fold:hover{background:var(--blue-bg)}
/* hover 微操作 */
.quick{position:absolute;right:10px;top:8px;display:none;gap:4px}
.node-card:hover .quick{display:flex}
.quick button{font-size:11px;border-radius:4px;padding:1px 7px;border:none;background:#f7f8fa;color:var(--sub)}
.quick button:hover{border-color:var(--blue);color:var(--blue)}
/* ── 树状缩略图 ── */
.minimap svg{width:100%;height:auto;display:block;min-height:36px}
.mm-note{font-size:11px;color:var(--sub);margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mm-k{display:inline-flex;align-items:center;gap:4px}
.mm-r{display:inline-block;width:14px;height:9px;border-radius:2px;background:none;border:1.5px solid #999}
.mm-r.fill{background:#fff}
/* ── 详情面板 ── */
.agent-card{border:none;background:var(--blue-soft);border-radius:8px;padding:12px;margin-bottom:14px}
.agent-card .a-head{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:4px}
.agent-card .a-body{font-size:13px;margin-bottom:10px}
.d-type{margin-bottom:8px}
.d-content{font-size:15px;font-weight:500;margin-bottom:8px}
.d-src{font-size:12px;color:var(--sub);background:var(--page);border-radius:6px;padding:8px 10px;margin-bottom:12px}
.d-src a{color:var(--blue)}
.d-actions{display:flex;flex-direction:column;gap:8px}
.d-actions .btn{text-align:center}
.d-conflict{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:none}
.d-conflict.show{display:block}
.d-conflict .c-item{font-size:13px;padding:7px 10px;background:#f7f8fa;border-radius:6px;margin-top:6px;cursor:pointer}
.d-conflict .c-item:hover{border-color:var(--blue);color:var(--blue)}
.d-empty{color:var(--sub);font-size:13px;text-align:center;padding:30px 0}
/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:rgba(18,18,18,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding-top:12vh}
.mask.show{display:flex}
.modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;padding:22px}
.modal h3{font-size:16px;margin-bottom:4px}
.modal .m-sub{font-size:12px;color:var(--sub);margin-bottom:14px}
.stance-pick{display:flex;gap:8px;margin-bottom:12px}
.stance-pick button{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;background:#f7f8fa}
.stance-pick button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);font-weight:600}
.stance-pick button:disabled{opacity:.45;cursor:not-allowed}
textarea{width:100%;height:96px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:vertical;outline:none}
textarea:focus{border-color:var(--blue)}
.m-hint{font-size:12px;color:var(--sub);margin:8px 0 14px}
.m-hint em{font-style:normal;color:var(--warn)}
.m-foot{display:flex;justify-content:flex-end;gap:10px}
/* ── 视图切换 ── */
.vbtns{display:flex;border:none;gap:2px}
.vbtns button{padding:6px 14px;font-size:13px;color:var(--sub);background:none;border-radius:0;position:relative}
.vbtns button.on{background:none;color:var(--blue);font-weight:500}
.vbtns button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--blue);border-radius:1px}
/* ── 关系图谱 ── */
#graph-panel{flex:1.5;background:none;border:none;border-radius:0;
  padding:8px 4px;min-width:0;position:relative;display:none}
#graph-svg{width:100%;height:660px;display:block;border-radius:8px;background:#fbfbfc;cursor:grab}
#graph-svg.panning{cursor:grabbing}
.g-legend{position:absolute;left:16px;top:16px;display:flex;gap:12px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);border:none;box-shadow:0 2px 8px rgba(18,18,18,.06);border-radius:6px;
  padding:5px 12px;font-size:11.5px;color:var(--sub)}
.g-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.g-controls{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
.g-controls .btn{padding:5px 12px;font-size:12px;background:#fff;border:none;box-shadow:0 1px 4px rgba(18,18,18,.08);color:var(--ink)}
.g-controls .btn:hover{background:#f0f2f5;color:var(--blue)}
.glink{stroke:#d5dae4;stroke-width:1.2;fill:none;transition:opacity .15s}
.glink.cross{stroke-dasharray:4 3;stroke:#c9cfdb}
.glink.dim{opacity:.12}
.glink.hl{stroke:var(--blue);stroke-width:1.8}
.gnode{cursor:grab;transition:opacity .15s}
.gnode:active{cursor:grabbing}
.gnode.dim{opacity:.13}
.gnode circle{stroke:#fff;stroke-width:2}
.gnode.cur circle{stroke:var(--blue);stroke-width:2.5}
.gnode.center circle{stroke:var(--blue);stroke-width:3}
.gnode.center text{fill:var(--blue);font-weight:600}
.gnode text{font-size:10.5px;fill:var(--ink);text-anchor:middle;pointer-events:none;
  user-select:none;-webkit-user-select:none;
  paint-order:stroke;stroke:#fbfbfc;stroke-width:3px;stroke-linejoin:round}
.gnode .g-sub{font-size:10px;fill:var(--sub)}
</style>

const byId = {}, parentOf = {};
(function index(n,p,d){ byId[n.id]=n; parentOf[n.id]=p; n.depth=d; n.children.forEach(c=>index(c,n,d+1)); })(tree,null,0);
/* 渐进展开：初始只显示根节点，点击节点才展开它的下一级 */
const expanded = new Set();
function expandTo(id){ let cur=byId[id]; while(cur){ expanded.add(cur.id); cur=parentOf[cur.id]; } }
/* 新节点必须注册进索引，否则 selectNode/expandTo 找不到它 */
function register(n,p){ byId[n.id]=n; parentOf[n.id]=p; n.depth=(p?p.depth+1:0); }

/* ────────── 渲染 ────────── */
function tagOf(n){
  const map={pro:'pro',con:'con',neu:'neu'};
  const cls = n.type==='question' ? 'que' : map[n.stance];
  return `<span class="n-tag ${cls}">${TYPE_LABEL[cls]}</span>`;
}
function votesHtml(n){
  if(n.type==='question'||!n.votes) return '';
  return `<span class="n-votes">
    <button onclick="vote(event,'${n.id}',1)">▲</button><b id="v-${n.id}">${n.votes.up-n.votes.down}</b>
    <button onclick="vote(event,'${n.id}',-1)">▼</button></span>`;
}
function renderNode(n){
  const hasKids = n.children.length>0;
  const open = expanded.has(n.id);
  const src = n.source ? `<a class="n-src" href="${n.source.url}" onclick="return false">源自知乎回答</a>` : '';
  const answered = n.type==='question' && n.answered===false ? `<span style="color:var(--warn)">待回应</span>` : '';
  const kids = hasKids && open ? `<div class="branch">${n.children.map(c=>renderNode(c)).join('')}</div>` : '';
  const quick = n.type==='root'
    ? `<div class="quick"><button onclick="openModal('${n.id}','pro')">＋支持</button><button onclick="openModal('${n.id}','con')">＋反对</button><button onclick="openModal('${n.id}','neu')">＋看条件</button></div>`
    : `<div class="quick"><button onclick="openModal('${n.id}','pro')">＋支持</button><button onclick="openModal('${n.id}','con')">＋反对</button></div>`;
  return `<div class="node-row ${n.type==='root'?'root-row':''}" data-id="${n.id}">

      ${hasKids?`<button class="fold" onclick="toggle(event,'${n.id}')">${open?'收起 ▲':'展开 '+n.children.length+' 条回应 ▼'}</button>`:''}
      <span class="n-text">${n.text}</span>
      ${n.evidence?`<span class="n-evid"><b>依据</b>${n.evidence}</span>`:''}
      <span class="n-meta">

}
function renderTree(){

function walk(n,fn){ fn(n); n.children.forEach(c=>walk(c,fn)); }
function renderStats(){
  let c={pro:0,con:0,neu:0,que:0};
  walk(tree,n=>{
    if(n.type==='question') c.que++;
    else if(n.stance==='pro') c.pro++;
    else if(n.stance==='con') c.con++;
    else if(n.stance==='neu') c.neu++;
  });
  const total=c.pro+c.con+c.neu||1;
  document.getElementById('seg-pro').style.width=(c.pro/total*100)+'%';
  document.getElementById('seg-neu').style.width=(c.neu/total*100)+'%';
  document.getElementById('seg-con').style.width=(c.con/total*100)+'%';
  document.getElementById('cnt-pro').textContent=c.pro;
  document.getElementById('cnt-con').textContent=c.con;
  document.getElementById('cnt-neu').textContent=c.neu;
  document.getElementById('cnt-que').textContent=c.que;
  const top=Math.max(c.pro,c.con,c.neu);
  document.getElementById('balance-warn').classList.toggle('show', top/total>0.7);
}

/* ────────── 树状缩略图 ────────── */
const MM={W:52,H:20,GX:14,GY:30};
function visibleNodes(){ const list=[];(function c(n){list.push(n);if(expanded.has(n.id))n.children.forEach(c);})(tree);return list; }
function mmColor(n){
  if(n.type==='root'||n.type==='question') return '#056DE8';
  return n.stance==='pro'?'#056DE8':n.stance==='con'?'#121212':'#a9aebc';
}
function renderMinimap(){
  const svg=document.getElementById('mm-svg'); if(!svg) return;
  const pos={}; let leaf=0,maxD=0;
  (function place(n,d){
    maxD=Math.max(maxD,d);
    const kids=expanded.has(n.id)?n.children:[];
    if(!kids.length){ pos[n.id]={x:leaf*(MM.W+MM.GX)+MM.W/2,y:d}; leaf++; }
    else{ kids.forEach(k=>place(k,d+1));
      const xs=kids.map(k=>pos[k.id].x);
      pos[n.id]={x:(Math.min(...xs)+Math.max(...xs))/2,y:d}; }
  })(tree,0);
  // viewBox 设最小尺寸并居中内容：单叶树若按内容裁剪，矩形会被放大数倍、描边变粗框
  const MINW=260, MINH=120;
  const contentW=Math.max(leaf*(MM.W+MM.GX)-MM.GX,MM.W), contentH=(maxD+1)*(MM.H+MM.GY)-MM.GY;
  const W=Math.max(contentW,MINW), H=Math.max(contentH,MINH);
  const dx=(W-contentW)/2, dy=(H-contentH)/2;
  const py=d=>d*(MM.H+MM.GY);
  let edges='';
  (function e(n){
    if(expanded.has(n.id)) n.children.forEach(c=>{
      edges+=`<line x1="${pos[n.id].x}" y1="${py(pos[n.id].y)+MM.H}" x2="${pos[c.id].x}" y2="${py(pos[c.id].y)}" stroke="#d5dae4" stroke-width="1"/>`;
      e(c); });
  })(tree);
  let rects='';
  visibleNodes().forEach(n=>{
    const p=pos[n.id], col=mmColor(n), sel=n.id===selectedId;
    rects+=`<rect x="${(p.x-MM.W/2).toFixed(1)}" y="${py(p.y)}" width="${MM.W}" height="${MM.H}" rx="4" fill="${sel?'#fff':'none'}" stroke="${col}" stroke-width="${sel?2.5:1.5}"${n.type==='question'?' stroke-dasharray="3 2"':''}/>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<g transform="translate(${dx} ${dy})">${edges+rects}</g>`;
}

  body.innerHTML=`

      <div class="a-body">${n.agentHint}</div>
      <button class="btn btn-primary" onclick="followUp('${n.id}')">以此追问</button>
    </div>`:''}
    ${n.source?`<div class="d-src">知乎回答摘要：「${n.source.quote}」<br><a href="${n.source.url}" onclick="return false">查看原文</a></div>`:''}

      ${n.type!=='question'?`<button class="btn btn-ghost" onclick="openQuestion('${n.id}')">追问此节点</button>`:''}
    </div>
    <div class="d-conflict ${conflict.length?'show':''}">
      <span style="font-size:12px;color:var(--sub)">与它冲突的节点</span>
      ${conflict.map(c=>`<div class="c-item" onclick="jumpTo('${c.id}')">${c.text}</div>`).join('')}
    </div>`;
}
function findConflicts(n){
  let out=[];
  function scan(x){
    if(x.id!==n.id && x.stance && n.stance && x.stance!==n.stance && x.stance!=='neu' && n.stance!=='neu' && x.type==='claim' && n.type==='claim')
      out.push(x);
    x.children.forEach(scan);
  }
  scan(tree);
  return out.slice(0,3);
}

   节点数量变化时重算跳数并重启松弛，布局自适应缩放。 */
const RING0=180, RING_STEP=125;          /* hop1 / hop2… 的目标环半径（等效距离） */

let gNodes=[], gLinkEls=[], gNodeEls={}, gSel=null;

function layoutScale(){ return Math.max(0.75,Math.min(1.6,Math.sqrt(gNodes.length/21))); }
function pickCenterByDegree(){
  const deg={};
  gLinkEls.forEach(l=>{ deg[l.s]=(deg[l.s]||0)+1; deg[l.t]=(deg[l.t]||0)+1; });
  return [...gNodes].sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0))[0].id;
}
/* 从中心沿边 BFS 算跳数；未连通节点归入最外层 */
function recomputeHops(){
  gHops={};
  if(!gNodes.length) return;
  if(!gNodes.some(n=>n.id===gCenterId)) gCenterId=gNodes[0].id;
  const adj={}; gNodes.forEach(n=>adj[n.id]=[]);
  gLinkEls.forEach(l=>{ (adj[l.s]||[]).push(l.t); (adj[l.t]||[]).push(l.s); });
  const q=[gCenterId]; gHops[gCenterId]=0;
  while(q.length){
    const cur=q.shift();
    (adj[cur]||[]).forEach(nb=>{ if(gHops[nb]===undefined){ gHops[nb]=gHops[cur]+1; q.push(nb); } });
  }
  const maxHop=Math.max(1,...Object.values(gHops));
  gNodes.forEach(n=>{ if(gHops[n.id]===undefined) gHops[n.id]=maxHop+1; });
}

    + '<span style="color:var(--blue)">◎ 中心议题（双击节点可切换）</span>';
  /* 中心环标记（画在连线上、节点下） */
  const ring=document.createElementNS(NS,'circle');
  ring.setAttribute('id','g-center-ring');
  ring.setAttribute('r',15); ring.setAttribute('fill','none');
  ring.setAttribute('stroke','var(--blue)'); ring.setAttribute('stroke-width',1.5);
  ring.setAttribute('stroke-dasharray','3 3');
  document.getElementById('g-links').appendChild(ring);
  /* 节点与连线 */
  gNodes=TOPICS.map(t=>({...t, x:GW/2, y:GH/2, vx:0,vy:0, fx:null,fy:null, r:7.5+Math.sqrt(t.w)*0.78}));
  gLinkEls=GLINKS.map(l=>makeLinkEl(l[0],l[1],l[2]==='cross'));
  gCenterId=pickCenterByDegree(); recomputeHops();
  /* 初始位置：按跳数目标环 + 黄金角均匀撒点（纵向按画布比例压缩），中心直接就位 */
  let k=0;
  gNodes.forEach(n=>{
    if(n.id===gCenterId){ n.x=GW/2; n.y=GH/2; return; }
    const a=k*2.399, R=ringR(gHops[n.id]||2); k++;
    n.x=GW/2+Math.cos(a)*R; n.y=GH/2+Math.sin(a)*R/SQUISH;
  });
  gNodes.forEach(makeNodeEl);
  applyGraphView();
  graphRestart(false);
}
function makeLinkEl(sid,tid,cross){
  const p=document.createElementNS(NS,'path');
  p.setAttribute('class','glink'+(cross?' cross':''));
  document.getElementById('g-links').appendChild(p);
  return {s:sid, t:tid, cross:!!cross, el:p};
}
function makeNodeEl(n){
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class','gnode'+(n.cur?' cur':''));
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('r',n.r); c.setAttribute('fill',clusterOf(n.c).color);
  const title=document.createElementNS(NS,'text');
  /* 标题两行排 */
  const line1=n.t.slice(0,Math.ceil(n.t.length/2)), line2=n.t.slice(Math.ceil(n.t.length/2));
  const y0=n.r+14;
  title.innerHTML=`<tspan x="0" y="${y0}">${line1}</tspan>`+(line2?`<tspan x="0" y="${y0+12}">${line2}</tspan>`:'');
  g.appendChild(c); g.appendChild(title);
  /* d3 dragstart 语义：按下即钉在当前位置、加热模拟（alphaTarget 0.3），邻居开始响应 */
  g.addEventListener('mousedown',e=>{
    e.stopPropagation(); e.preventDefault();
    gDragNode=n; gDragMoved=false; gDragStart={x:e.clientX,y:e.clientY};
    n.fx=n.x; n.fy=n.y;
    graphDragPulse();
  });
  g.addEventListener('click',e=>{ e.stopPropagation(); if(!gDragMoved) selectGraphTopic(n.id); });
  g.addEventListener('dblclick',e=>{ e.stopPropagation(); graphSetCenter(n.id); });
  document.getElementById('g-nodes').appendChild(g);
  gNodeEls[n.id]={g,circle:c};
}
/* 力：①库仑斥力（全对） ②胡克弹力（边） ③径向弹簧（hop 目标环） ④同簇弱内聚 */
function graphStep(){
  const N=gNodes;
  if(!N.length) return;
  const center=N.find(n=>n.id===gCenterId)||N[0];
  const ca=Math.max(gAlpha,0.12);
  /* ① 库仑斥力 f=K_REP·α/d²，外加硬性最小间距（圆身+标签宽）防压叠 */
  for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
    const a=N[i],b=N[j];
    let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
    if(d2<1) { dx=(Math.random()-.5); dy=(Math.random()-.5); d2=1; }
    const d=Math.sqrt(d2), f=K_REP*gAlpha/d2, fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    const minD=a.r+b.r+42;
    if(d<minD){
      /* 保底 0.55：α 冷却后防重叠推力依然有效，不随布局静止而失效 */
      const push=(minD-d)*0.20*(0.55+0.45*gAlpha);
      a.vx+=dx/d*push; a.vy+=dy/d*push; b.vx-=dx/d*push; b.vy-=dy/d*push;
    }
  }
  /* ② 胡克弹力 f=K_SPRING·(d−L0)；跨域边的自然长度更长 */
  gLinkEls.forEach(l=>{
    const a=gNodes.find(n=>n.id===l.s), b=gNodes.find(n=>n.id===l.t);
    if(!a||!b) return;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const L0=(l.cross?255:170)*layoutScale();
    const f=(d-L0)*K_SPRING*gAlpha, fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  /* ③ 径向弹簧：节点被稳定拉向自身跳数的目标环（层次清晰的来源）。
     目标环为椭圆（横向 R、纵向 R/SQUISH）：等效距离在 y 放大 SQUISH 的变换空间计算，
     力沿椭圆法线方向（vy 分量同步放大 SQUISH），节点收敛到椭圆上而非圆上 */
  N.forEach(n=>{
    if(n.id===gCenterId) return;
    const dx=n.x-center.x, dy=n.y-center.y;
    const dex=Math.sqrt(dx*dx+(dy*SQUISH)*(dy*SQUISH))||1;
    const f=(dex-ringR(gHops[n.id]||2))*K_RADIAL*ca;
    n.vx-=dx/dex*f; n.vy-=dy/dex*f*SQUISH;
  });
  /* ④ 同簇弱内聚：同色议题轻微聚拢（视觉分组），不再强制分区 */
  CLUSTERS.forEach(c=>{
    const members=N.filter(n=>n.c===c.id);
    if(members.length<2) return;
    const cx=members.reduce((s,n)=>s+n.x,0)/members.length;
    const cy=members.reduce((s,n)=>s+n.y,0)/members.length;
    members.forEach(n=>{
      if(n.id===gCenterId) return;
      n.vx+=(cx-n.x)*0.018*ca;
      n.vy+=(cy-n.y)*0.018*ca;
    });
  });
  /* 积分：中心节点非拖拽时恒定画布中心（拖拽中随 fx/fy 走，松手弹回）；
     其余阻尼滑动并约束在画布内 */
  N.forEach(n=>{
    if(n.id===gCenterId && n.fx==null){ n.x=GW/2; n.y=GH/2; n.vx=n.vy=0; return; }
    n.vx*=0.85; n.vy*=0.85;
    if(n.fx!=null){ n.x=n.fx; n.y=n.fy; n.vx=n.vy=0; }
    else{ n.x=Math.max(50,Math.min(GW-50,n.x+n.vx)); n.y=Math.max(34,Math.min(GH-58,n.y+n.vy)); }
  });
  gAlpha*=0.988;
  if(gAlpha<0.02 && gTimer){ clearInterval(gTimer); gTimer=null; }
}
function graphDraw(){
  const ring=document.getElementById('g-center-ring');
  const center=gNodes.find(n=>n.id===gCenterId);
  if(ring&&center){ ring.setAttribute('cx',center.x); ring.setAttribute('cy',center.y); }
  gLinkEls.forEach(l=>{
    const a=gNodes.find(n=>n.id===l.s), b=gNodes.find(n=>n.id===l.t);
    if(!a||!b){ l.el.setAttribute('d',''); return; }
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    l.el.setAttribute('d',`M ${a.x} ${a.y} L ${mx} ${my} L ${b.x} ${b.y}`);
    if(gSel){
      const on=l.s===gSel||l.t===gSel;
      l.el.classList.toggle('dim',!on);
      l.el.classList.toggle('hl',on);
    } else { l.el.classList.remove('dim','hl'); }
  });
  gNodes.forEach(n=>{
    const {g}=gNodeEls[n.id];
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
    g.classList.toggle('center', n.id===gCenterId);
    if(gSel){
      const isNb=gLinkEls.some(l=>(l.s===gSel&&l.t===n.id)||(l.s===n.id&&l.t===gSel));
      g.classList.toggle('dim', n.id!==gSel && !isNb);
    } else g.classList.remove('dim');
  });
}
function applyGraphView(){
  document.getElementById('g-viewport').setAttribute('transform',`translate(${gv.x},${gv.y}) scale(${gv.k})`);
}
function graphRestart(unpin){
  if(unpin) gNodes.forEach(n=>{ n.fx=null; n.fy=null; });
  gAlpha=Math.max(gAlpha,1);
  if(!gTimer) gTimer=setInterval(()=>{ graphStep(); graphDraw(); },16);
}
/* d3 alphaTarget(0.3) 等效：拖拽期间把「温度」维持在 0.3（邻居轻微跟随），
   不拉满 1，避免整图高能抖动；若已冷却停表则重新点火 */
function graphDragPulse(){
  gAlpha=Math.max(gAlpha,0.3);
  if(!gTimer) gTimer=setInterval(()=>{ graphStep(); graphDraw(); },16);
}
/* d3 dragend 等效：松手解除 fx/fy 固定，节点重新参与力学，
   邻居凭当前 α（≈0.3 起自然衰减）继续滑动到新平衡 */
function endGraphDrag(){
  if(gDragNode){ gDragNode.fx=null; gDragNode.fy=null; }
  gDragNode=null; gDragStart=null; gPan=null;
}
/* ── 动态重布局：节点数量变化后重算跳数、重启松弛，布局自适应缩放 ── */
const EXTRA_TOPICS=[
  {id:'x1',c:'edu',    t:'AI 进课堂对孩子是利好还是负担', w:88,  dist:[44,26,30]},
  {id:'x2',c:'career', t:'大厂高薪和稳定编制怎么选',       w:120, dist:[35,28,37]},
  {id:'x3',c:'life',   t:'婚姻到底该不该门当户对',         w:95,  dist:[40,20,40]},
];
let extraPool=[...EXTRA_TOPICS];
function graphAddNode(t,linkTo){
  if(gNodes.some(n=>n.id===t.id)) return;
  const n={...t, x:GW/2, y:GH/2, vx:0,vy:0, fx:null,fy:null, r:7.5+Math.sqrt(t.w)*0.78};
  gNodes.push(n);
  if(linkTo&&gNodes.some(x=>x.id===linkTo)) gLinkEls.push(makeLinkEl(linkTo,t.id,false));
  makeNodeEl(n);
  recomputeHops();
  graphRestart(false);
}
function graphRemoveNode(id){
  const i=gNodes.findIndex(n=>n.id===id);
  if(i<0) return;
  const el=gNodeEls[id]; if(el&&el.g.remove)el.g.remove();
  delete gNodeEls[id];
  gLinkEls=gLinkEls.filter(l=>{
    if(l.s===id||l.t===id){ if(l.el.remove)l.el.remove(); return false; }
    return true;
  });
  gNodes.splice(i,1);
  if(gCenterId===id) gCenterId=pickCenterByDegree();
  if(gSel===id){ gSel=null; renderGraphDetail(); }
  recomputeHops();
  graphRestart(false);
}
function graphSetCenter(id){
  if(!gNodes.some(n=>n.id===id)||id===gCenterId) return;
  gCenterId=id; recomputeHops();
  const c=gNodes.find(n=>n.id===id);
  c.x=GW/2; c.y=GH/2;
  gAlpha=Math.max(gAlpha,0.9);
  if(!gTimer) gTimer=setInterval(()=>{ graphStep(); graphDraw(); },16);
  if(gSel===id) renderGraphDetail();
}
/* 工具栏演示：模拟议题库增量 / 删减 */
function graphAddRandom(){
  if(!extraPool.length||!gNodes.length) return;
  const t=extraPool.shift();
  const same=gNodes.filter(n=>n.c===t.c);
  const linkTo=(gSel&&Math.random()<0.5)?gSel:(same.length?same[Math.floor(Math.random()*same.length)].id:null);
  graphAddNode(t,linkTo);
}
function graphRemoveRandom(){
  if(gNodes.length<=6) return;
  const pool=gNodes.filter(n=>n.id!==gCenterId&&!n.cur);
  if(!pool.length) return;
  graphRemoveNode(pool[Math.floor(Math.random()*pool.length)].id);
}
function graphZoom(f){
  const r=document.getElementById('graph-svg').getBoundingClientRect();
  graphSetZoom(gv.k*f, r.width/2, r.height/2);
}
function graphSetZoom(k2,mx,my){
  const r=document.getElementById('graph-svg').getBoundingClientRect();
  const sx=(mx)*(GW/r.width), sy=(my)*(GH/r.height);
  k2=Math.max(0.4,Math.min(2.5,k2));
  gv.x=sx-(sx-gv.x)*k2/gv.k; gv.y=sy-(sy-gv.y)*k2/gv.k; gv.k=k2;
  applyGraphView();
}
(function bindGraphEvents(){
  const svg=document.getElementById('graph-svg');
  const toWorld=(e)=>{
    const r=svg.getBoundingClientRect();
    return { x:((e.clientX-r.left)*(GW/r.width)-gv.x)/gv.k,
             y:((e.clientY-r.top)*(GH/r.height)-gv.y)/gv.k };
  };
  svg.addEventListener('mousedown',e=>{
    if(e.target.closest('.gnode')) return;
    gPan={sx:e.clientX,sy:e.clientY,ox:gv.x,oy:gv.y};
    svg.classList.add('panning');
  });
  window.addEventListener('mousemove',e=>{
    if(gDragNode){
      /* 位移超过 3px 才算真拖拽，否则保留 click 选中语义 */
      if(gDragStart && Math.abs(e.clientX-gDragStart.x)+Math.abs(e.clientY-gDragStart.y)>3) gDragMoved=true;
      const p=toWorld(e);
      gDragNode.fx=Math.max(40,Math.min(GW-40,p.x));
      gDragNode.fy=Math.max(40,Math.min(GH-70,p.y));
      gDragNode.x=gDragNode.fx; gDragNode.y=gDragNode.fy;
      graphDragPulse();
    } else if(gPan){
      const r=svg.getBoundingClientRect(), sc=GW/r.width;
      gv.x=gPan.ox+(e.clientX-gPan.sx)*sc; gv.y=gPan.oy+(e.clientY-gPan.sy)*sc;
      applyGraphView();
    }
  });
  window.addEventListener('mouseup',()=>{ endGraphDrag(); svg.classList.remove('panning'); });
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect();
    graphSetZoom(gv.k*(e.deltaY<0?1.12:0.9), e.clientX-r.left, e.clientY-r.top);
  },{passive:false});
})();
function selectGraphTopic(id){
  gSel=(gSel===id)?null:id;
  graphDraw(); renderGraphDetail();
}
function renderGraphDetail(){
  const body=document.getElementById('detail-body');
  if(!gSel){ body.innerHTML='<div class="d-empty">点击图谱中的议题节点<br>查看立场分布与关联议题</div>'; return; }
  const n=TOPICS.find(t=>t.id===gSel), c=clusterOf(n.c);
  const links=gLinkEls.filter(l=>l.s===n.id||l.t===n.id).map(l=>gNodes.find(t=>t.id===(l.s===n.id?l.t:l.s))).filter(Boolean);
  body.innerHTML=`
    <div class="d-type"><span class="n-tag" style="background:${c.color}">${c.name}</span>
      ${n.cur?'<span class="n-tag" style="background:var(--blue)">当前辩论局</span>':''}
      ${n.id===gCenterId?'<span class="n-tag" style="background:var(--blue)">◎ 中心议题</span>':''}</div>
    <div class="d-content">${n.t}</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">立场分布 · 参与热度 ${n.w}</div>
    <div class="bar" style="margin-bottom:4px">
      <div class="seg-pro" style="width:${n.dist[0]}%"></div>
      <div class="seg-neu" style="width:${n.dist[1]}%"></div>
      <div class="seg-con" style="width:${n.dist[2]}%"></div>
    </div>
    <div style="font-size:11.5px;color:var(--sub);margin-bottom:12px">支持 ${n.dist[0]}% · 看条件 ${n.dist[1]}% · 反对 ${n.dist[2]}%</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">关联议题（${links.length}）</div>
    ${links.map(x=>`<div class="c-item" style="margin-bottom:5px" onclick="selectGraphTopic('${x.id}')">${x.t}</div>`).join('')}
    <div class="d-actions" style="margin-top:12px">
      <button class="btn btn-primary" onclick="switchView('tree')">进入这个议题的辩论树 →</button>
      <button class="btn btn-ghost" onclick="graphSetCenter('${n.id}')">${n.id===gCenterId?'◎ 已是中心':'◎ 设为中心'}</button>
    </div>`;
}

/* ────────── 视图切换 ────────── */
function switchView(v){
  const g=(v==='graph');
  document.getElementById('vb-tree').classList.toggle('on',!g);
  document.getElementById('vb-graph').classList.toggle('on',g);
  document.getElementById('tree-panel').style.display=g?'none':'';
  document.getElementById('graph-panel').style.display=g?'block':'none';
  document.getElementById('topic-strip').style.display=g?'none':'';
  document.getElementById('mm-card').style.display=g?'none':'';
  if(g){
    if(!gNodes.length){ initGraph(); }
    else graphRestart(false);
    if(!gSel) renderGraphDetail();
  } else {
    if(gTimer){ clearInterval(gTimer); gTimer=null; }
    renderTree();
    if(selectedId) selectNode(selectedId);
    else document.getElementById('detail-body').innerHTML='<div class="d-empty">在左侧选择一个节点</div>';
  }
}

/* ────────── 启动 ────────── */
renderTree();   /* 初始只显示根节点，点击才逐级展开 */
document.getElementById('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeModal(); });
</script>
</body>
