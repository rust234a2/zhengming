<svg viewBox="0 0 680 225" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>四个视觉编码通道</title>
  <desc>颜色编码类别、形状编码类型、大小编码重要性、粗细编码关系强度，每个通道都必须对应一个真实字段。</desc>
  <style>
    .th { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #5F5E5A; }
    .tl { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #444441; }
  </style>
  <text class="th" x="40" y="46">视觉编码通道</text>
  <text class="ts" x="40" y="64">每个维度必须对应一个真实字段</text>
  <circle cx="100" cy="125" r="10" fill="#378ADD"/>
  <circle cx="135" cy="125" r="10" fill="#E24B4A"/>
  <circle cx="250" cy="125" r="10" fill="#85B7EB"/>
  <rect x="272" y="115" width="20" height="20" rx="3" fill="#85B7EB"/>
  <polygon points="310,135 325,115 340,135" fill="#85B7EB"/>
  <circle cx="395" cy="125" r="6" fill="#85B7EB"/>
  <circle cx="420" cy="125" r="10" fill="#85B7EB"/>
  <circle cx="448" cy="125" r="14" fill="#85B7EB"/>
  <line x1="540" y1="110" x2="590" y2="110" stroke="#378ADD" stroke-width="1"/>
  <line x1="540" y1="125" x2="590" y2="125" stroke="#378ADD" stroke-width="2"/>
  <line x1="540" y1="140" x2="590" y2="140" stroke="#378ADD" stroke-width="3.5"/>
  <text class="tl" x="115" y="172" text-anchor="middle">颜色 → 类别</text>
  <text class="tl" x="265" y="172" text-anchor="middle">形状 → 类型</text>
  <text class="tl" x="415" y="172" text-anchor="middle">大小 → 重要性</text>
  <text class="tl" x="565" y="172" text-anchor="middle">粗细 → 强度</text>
  <text class="ts" x="40" y="205">同色必同义 — 颜色语义漂移比没有颜色更糟</text>
</svg>
