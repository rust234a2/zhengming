<svg viewBox="0 0 680 270" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>气象图语法的等值线表达</title>
  <desc>用同心等值线表示讨论密度，用 H 标记标出争议最热的议题簇，读者不需要图例就能读懂。</desc>
  <style>
    .th { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #5F5E5A; }
  </style>
  <text class="th" x="40" y="46">气象图语法</text>
  <text class="ts" x="40" y="64">等值线画密度，H 标最热的议题簇</text>
  <ellipse cx="200" cy="148" rx="160" ry="88" fill="#E6F1FB" fill-opacity="0.35"/>
  <ellipse cx="528" cy="136" rx="112" ry="72" fill="#FAEEDA" fill-opacity="0.3"/>
  <ellipse cx="210" cy="150" rx="130" ry="68" fill="none" stroke="#85B7EB" stroke-width="0.5"/>
  <ellipse cx="210" cy="150" rx="92" ry="48" fill="none" stroke="#85B7EB" stroke-width="0.5"/>
  <ellipse cx="210" cy="150" rx="54" ry="28" fill="none" stroke="#378ADD" stroke-width="0.5"/>
  <ellipse cx="530" cy="135" rx="85" ry="44" fill="none" stroke="#85B7EB" stroke-width="0.5"/>
  <ellipse cx="530" cy="135" rx="46" ry="24" fill="none" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="210" y="150" text-anchor="middle" dominant-baseline="central" fill="#185FA5">H</text>
  <text class="th" x="530" y="135" text-anchor="middle" dominant-baseline="central" fill="#185FA5">H</text>
  <text class="ts" x="40" y="252">借读者已经会读的语言 — 不必先教图例</text>
</svg>
