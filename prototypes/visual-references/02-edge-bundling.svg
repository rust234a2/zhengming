<svg viewBox="0 0 680 262" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>直线与分层边捆绑的对比</title>
  <desc>左图八条边以直线连接上下两组节点，彼此交叉成毛线团；右图同样的边沿层级路由后在中轴收拢成束，跨组流量清晰可见。</desc>
  <style>
    .th { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #5F5E5A; }
  </style>
  <text class="th" x="40" y="46">直线</text>
  <text class="ts" x="40" y="64">每条边互相打架</text>
  <line x1="70" y1="110" x2="130" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="70" y1="110" x2="250" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="110" x2="70" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="110" x2="190" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="110" x2="70" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="110" x2="250" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="110" x2="130" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="110" x2="190" y2="190" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <circle cx="70" cy="110" r="6" fill="#378ADD"/>
  <circle cx="130" cy="110" r="6" fill="#378ADD"/>
  <circle cx="190" cy="110" r="6" fill="#378ADD"/>
  <circle cx="250" cy="110" r="6" fill="#378ADD"/>
  <circle cx="70" cy="190" r="6" fill="#E24B4A"/>
  <circle cx="130" cy="190" r="6" fill="#E24B4A"/>
  <circle cx="190" cy="190" r="6" fill="#E24B4A"/>
  <circle cx="250" cy="190" r="6" fill="#E24B4A"/>
  <text class="th" x="370" y="46">捆绑</text>
  <text class="ts" x="370" y="64">跨组流量变成河流</text>
  <path d="M 410 110 C 500 110, 500 190, 470 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 410 110 C 500 110, 500 190, 590 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 470 110 C 500 110, 500 190, 410 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 470 110 C 500 110, 500 190, 530 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 530 110 C 500 110, 500 190, 410 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 530 110 C 500 110, 500 190, 590 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 590 110 C 500 110, 500 190, 470 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <path d="M 590 110 C 500 110, 500 190, 530 190" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.3"/>
  <circle cx="410" cy="110" r="6" fill="#378ADD"/>
  <circle cx="470" cy="110" r="6" fill="#378ADD"/>
  <circle cx="530" cy="110" r="6" fill="#378ADD"/>
  <circle cx="590" cy="110" r="6" fill="#378ADD"/>
  <circle cx="410" cy="190" r="6" fill="#E24B4A"/>
  <circle cx="470" cy="190" r="6" fill="#E24B4A"/>
  <circle cx="530" cy="190" r="6" fill="#E24B4A"/>
  <circle cx="590" cy="190" r="6" fill="#E24B4A"/>
  <text class="ts" x="40" y="232">只对同类边捆绑 — bridge 与 rebuts 混捆会出现「假河」</text>
</svg>
