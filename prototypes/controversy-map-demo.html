替代是必然趋势。｜反方:文学、法律等专业翻译需文化背景与创造力，AI难以企及，全面替代遥遥无期。"},{"title":"人工智能翻译机会取代传统的人工翻译吗?","verdict":"放行","band":"gray","note":"正方:AI翻译已能处理日常文本，效率远超人工，市场正逐步被AI占领。｜反方:高端翻译需要情感、语境和创造性，AI无法替代，人工翻译仍不可缺。"},{"title":"为什么说只会码代码的码农没有前途?","verdict":"放行","band":"gray","note":"正方:技术更新快，仅会编码易被淘汰，需软技能和业务理解才能晋升。｜反方:编码是核心能力，技术专家同样有前途，管理并非唯一出路。"},{"title":"为什么别选计算机专业?","verdict":"放行","band":"gray","note":"正方:行业饱和、内卷严重、学习成本高，且AI可能取代初级岗位。｜反方:计算机仍是高薪行业，需求持续增长，个人能力决定前景。"},{"title":"谁能给我一个ai现在无法替代画师的理由?","verdict":"放行","band":"gray","note":"正方:AI缺乏真实情感与生活体验，无法创作出有灵魂、引发共鸣的作品。｜反方:AI已能模仿风格并生成高质量画作，商业插画等领域正被替代。"},{"title":"到现在为止,AI绘画让多少画师失业了?未来又会让多少画师失业?","verdict":"放行","band":"gray","note":"正方:已有画师因AI失业，未来低端绘画岗位将大幅减少。｜反方:AI仅辅助创作，画师需求转向创意指导，失业数据被夸大。"},{"title":"网传 OpenAI 招外包训练 ChatGPT 取代码农,会成功吗?","verdict":"放行","band":"gray","note":"正方:AI编程助手已能完成基础编码，取代码农是技术趋势。｜反方:复杂系统需人类架构师，AI仅辅助，取代码农不现实。"},{"title":"未来几年 AI 会取代艺术设计类的工作吗?","verdict":"放行","band":"gray","note":"正方:AI能快速生成设计稿，降低人力成本，基础设计岗位将消失。｜反方:艺术设计需创意与客户沟通，AI无法独立完成全流程。"},{"title":"艺术工作者会被AI取代吗?","verdict":"放行","band":"gray","note":"正方:AI可模仿风格并批量生产，商业艺术工作者面临失业风险。｜反方:艺术的核心是情感与思想，AI无法取代人类艺术家的独特表达。"},{"title":"程序员未来是不是会大量失业?","verdict":"放行","band":"gray","note":"正方:AI自动化编码工具已能完成基础开发任务，企业为降本增效将减少初级程序员岗位。｜反方:AI仅辅助编程，复杂系统设计、调试和创新仍需人类，程序员需求转向高技能岗位。"},{"title":"大家觉得ai绘画会替代画师吗?","verdict":"放行","band":"gray","note":"正方:AI绘画效率高、成本低，已能生成商用级作品，挤压中低端画师市场。｜反方:艺术创作依赖情感、原创性和客户沟通，AI无法替代高端画师和定制化需求。"},{"title":"现在人工智能做插画越来越厉害了,插画会被取代吗?","verdict":"放行","band":"gray","note":"正方:AI插画在速度、风格多样性和成本上优势明显，商业插画需求正转向AI。｜反方:插画需版权、独特创意和人文内涵，AI生成内容法律伦理问题多，难以完全取代。"},{"title":"AI 入侵设计领域,会完全替代设计师吗?","verdict":"放行","band":"gray","note":"正方:AI能自动生成UI、海报等设计，效率远超人类，标准化设计岗位将消失。｜反方:设计需理解用户、品牌和场景，AI缺乏同理心和战略思维，无法完全替代。"},{"title":"人工智能大爆发,AI编程工具对程序员到底是颠覆还是辅助?","verdict":"放行","band":"gray","note":"正方:AI编程工具能自动生成代码、修复bug，颠覆传统编程模式，减少人力需求。｜反方:AI工具提升效率但需程序员监督、架构和调试，本质是辅助而非颠覆。"},{"title":"二本院校学生计算机科学与技术专业往后的出路是什么?","verdict":"放行","band":"rule","note":"可辩性高、天然收敛"},{"title":"设计师存在的意义到底是什么?","verdict":"放行","band":"rule","note":"可辩性高、天然收敛"},{"title":"AI 在未来是否会代替编程工作,AI 与编程的关系将会走向何方?","verdict":"放行","band":"gray","note":"正方:AI可自主编写、优化代码，未来将承担大部分编程任务，人类转向需求定义。｜反方:编程是问题求解和系统设计，AI无法理解复杂业务，关系将是人机协作。"},{"title":"AI 对程序员的工作有什么影响?","verdict":"拒绝","band":"rule","note":"答案是清单，不存在对立立场"},{"title":"如果人人都可以通过 AI 写代码,程序员还需要存在吗?未来的程序员的工作会是什么?","verdict":"放行","band":"rule","note":"可辩性高、天然收敛"},{"title":"AI写程序的能力毋庸置疑很强大,为何没有取代程序员,是哪个环节的原因?","verdict":"放行","band":"gray","note":"正方:AI缺乏对模糊需求的理解、系统架构和跨团队协作能力，故未取代。｜反方:AI已在部分环节取代程序员，如代码生成，取代是渐进过程，环节在于信任和集成。"},{"title":"ai 已经能编出很完美的程序,程序员这个行业以后是不是会消失?","verdict":"放行","band":"gray","note":"正方:AI能独立完成编码，未来程序员岗位将大幅减少甚至消失。｜反方:程序员职责扩展至维护、创新和AI管理，行业不会消失而是转型。"},{"title":"ai大概还要多久就可以取代程序员了?","verdict":"放行","band":"gray","note":"正方:AI发展迅速，预计5-10年内可取代大部分程序员工作。｜反方:编程需创造力和复杂决策，AI永远无法完全取代，时间无法预测。"},{"title":"马斯克预计到明年底人类将无法与 AI 竞争软件开发,AI 将胜任所有数字工作,对程序员群体影响有多大?","verdict":"放行","band":"gray","note":"正方:马斯克预测若成真，程序员将面临大规模失业，影响深远。｜反方:预测过于乐观，AI受限于数据、伦理和实际部署，影响有限且渐进。"},{"title":"为什么总有人嘴硬说程序员不会被 AI 替代?","verdict":"放行","band":"gray","note":"正方:AI已能自动生成、调试代码，效率超人类，替代趋势明显。｜反方:编程需复杂问题解决、系统设计和业务理解，AI难以完全替代。"},{"title":"为什么画师、配音演员都在抵制 AI,程序员却普遍在拥抱 AI?","verdict":"放行","band":"gray","note":"正方:程序员拥抱AI因能提升效率，而画师配音抵制因AI直接模仿其风格。｜反方:程序员也担忧AI替代，拥抱是无奈或表面现象，抵制同样存在。"},{"title":"你认为AI编程未来真的会取代程序员吗?","verdict":"放行","band":"gray","note":"正方:AI发展迅速，未来可能取代大部分编程任务，程序员角色转变。｜反方:编程核心是创造与决策，AI是工具，无法取代人类程序员。"},{"title":"AI 写的代码还需要 Review 吗?只看 Spec + Harness 验收是否足够?","verdict":"放行","band":"gray","note":"正方:AI代码可能含隐蔽错误，必须人工Review，仅靠验收不足。｜反方:若Spec和Harness完备，可自动化验收，无需传统Review。"},{"title":"AI会完全取代码农的工作么?","verdict":"放行","band":"gray","note":"正方:AI将自动化所有编码任务，最终完全取代码农。｜反方:码农工作包含需求分析、架构设计等，AI无法完全取代。"},{"title":"😰 Redis 之父 Antirez 说「自己写代码已经没必要」,普通程序员该如何应对这场行业巨变?","verdict":"拒绝","band":"rule","note":"求的是步骤，不是观点"},{"title":"编程大神 DHH 谈 AI 写代码称「掌握编程的,永远是动手写的人」,AI 取代人类编程的边界在哪里?","verdict":"放行","band":"gray","note":"正方:AI将取代重复性编码，人类保留创造性编程，边界在创新。｜反方:AI可能超越人类创造力，边界模糊，最终取代所有编程。"},{"title":"在AI时代,计算机类专业学生的学习应如何调整?","verdict":"放行","band":"gray","note":"正方:学生应转向AI工具使用、高维设计，减少传统编码训练。｜反方:基础原理和算法仍核心，AI只是工具，不应削弱基础。"},{"title":"为什么现在画师几乎要被ai替代,而程序员行业不仅没被替代,反而看起来更繁荣了?","verdict":"放行","band":"rule","note":"问社会成因，可辩"},{"title":"Block 因AI裁员近50%,码农裁70%,股价飙涨24%,AI真会取代大部分人的工作吗?","verdict":"放行","band":"gray","note":"正方:案例显示AI直接导致裁员，证明AI将取代大部分工作。｜反方:裁员可能源于经济因素，AI是借口，不能证明普遍取代。"},{"title":"AI 是抢走了我们的工作,还是给了我们新的可能?","verdict":"放行","band":"gray","note":"正方:AI自动化取代岗位，导致失业，抢走工作。｜反方:AI创造新职业、提升效率，带来新机遇。"},{"title":"AI绘画,AI设计,AI真的能代替各行各业的设计师吗?","verdict":"放行","band":"rule","note":"可证伪"},{"title":"为什么作为一个设计师,我觉得ai不能代替设计?","verdict":"放行","band":"gray","note":"正方:设计需人类情感、创意和语境理解，AI无法替代。｜反方:AI已能生成优秀设计，未来可能替代大部分设计工作。"},{"title":"有了 AI 技术,以后画画还值得专业学习吗?AI 是否能取代画家?","verdict":"放行","band":"gray","note":"正方:AI能高效生成高质量图像，替代重复性绘画工作，专业绘画的经济价值下降。｜反方:绘画承载人类情感、创造力和文化价值，AI无法复制原创艺术灵魂，专业学习仍重要。"},{"title":"AI 会取代哪些职业?如何适应?(认同回答数最多的回答,必感谢)?","verdict":"放行","band":"gray","note":"正方:AI将取代重复性、规则性强的职业，如数据录入、客服，需学习新技能适应。｜反方:AI创造新职业并增强人类能力，许多职业需人类判断和情感，不会完全取代。"},{"title":"普通人选什么专业最不容易被 AI 替代?","verdict":"放行","band":"gray","note":"正方:选择需要创造力、情感交流和复杂决策的专业，如艺术、心理咨询，不易被AI替代。｜反方:AI进步迅速，任何专业都可能受影响，没有绝对安全区，需终身学习。"},{"title":"为什么我觉得AI绘画完全代替不了画师?","verdict":"放行","band":"gray","note":"正方:AI绘画缺乏人类的情感表达、原创性和意图，无法替代画师的艺术创作。｜反方:AI绘画在效率、成本和风格模仿上超越人类，能替代大量商业绘画工作。"},{"title":"AI 绘画会让童书插画师失业吗?","verdict":"放行","band":"gray","note":"正方:AI能快速生成多样插画，降低成本和周期，可能导致童书插画师失业。｜反方:童书插画需独特风格、情感共鸣和儿童心理理解，AI难以替代人类插画师。"},{"title":"2024 插画行业有没有受到 AI 冲击?AI 未来真的有可能代替插画师吗?","verdict":"放行","band":"rule","note":"可证伪"},{"title":"ai发展会取代板绘吗,为什么?","verdict":"放行","band":"gray","note":"正方:AI绘画工具能模拟板绘风格并快速生成作品，可能取代部分板绘需求。｜反方:板绘是创作过程，涉及手感、即时反馈和艺术表达，AI无法完全取代。"},{"title":"为什么才短短两三年,AI就已经泛滥成灾,到了人人喊打、人嫌狗厌的境地?","verdict":"放行","band":"gray","note":"正方:AI滥用导致隐私、失业和伦理问题，引发公众反感和抵制。｜反方:AI带来便利和创新，公众反感源于误解和媒体炒作，并非普遍现象。"},{"title":"Ai已横空出世,你有过一丝丝的担忧吗?","verdict":"放行","band":"gray","note":"正方:AI可能导致失业、隐私泄露和伦理危机，引发合理担忧。｜反方:AI推动社会进步，担忧被夸大，应积极拥抱而非恐惧。"},{"title":"设计师/程序员/文案等职业会被   var LINK_W = {bridge:2, rebuts:1.6, member:1.1, contains:0.8};
  var DIST = {member:{d:78,s:0.9}, contains:{d:118,s:0.32}, bridge:{d:165,s:0.55}, rebuts:{d:250,s:0.08}};
  var CHARGE = {cluster:-1150, topic:-560, claim:-170};
  var PAD = {cluster:34, topic:22, claim:13};

  var nodes = DATA.nodes.map(function(n){ var o={}; for(var k in n) o[k]=n[k]; return o; });
  var links = DATA.edges.map(function(e,i){ var o={}; for(var k in e) o[k]=e[k]; o.id=i; return o; });
  var nodeById = {}; nodes.forEach(function(n){ nodeById[n.id]=n; });

  var W = window.innerWidth, H = window.innerHeight;
  var svg = d3.select("#map");
  var g = svg.append("g");
  var gLinks = g.append("g").attr("class","cm-links");
  var gEmph = g.append("g").attr("class","cm-links-emphasis");
  var gRings = g.append("g").attr("pointer-events","none");  // 邻域高亮环（原型同款）
  var gNodes = g.append("g");
  var gLabels = g.append("g").attr("pointer-events","none");

  function baseR(n){
    if(n.kind==="cluster") return 13 + Math.min(16, (n.weight||0)*2.0);
    if(n.kind==="topic") return 10;
    return 5.5;
  }
  function trunc(s,n){ s=s||""; return s.length>n ? s.slice(0,n)+"…" : s; }
  function campOf(n){
    if(n.kind!=="claim") return null;
    return DATA.polarity[n.id] || "neutral";
  }
  function colorOf(n){
    if(n.kind==="topic") return "#111827";
    if(n.kind==="cluster") return mode==="v1" ? (V1C[n.side]||V1C.neutral) : V1C.neutral;
    if(mode==="v1") return V1L[n.side]||V1L.neutral;
    return DER[campOf(n)]||DER.neutral;
  }
  function strokeOf(n){
    if(n.kind==="cluster") return "#0b3f80";
    if(n.kind==="topic") return "#111827";
    return "#ffffff";
  }

  nodes.forEach(function(n,i){
    var a = i*2.39996, r = 120 + Math.sqrt(i)*46;
    n.x = W/2 + Math.cos(a)*r; n.y = H/2 + Math.sin(a)*r;
  });

  var sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function(d){return d.id;})
      .distance(function(l){ return (DIST[l.relation]||DIST.contains).d; })
      .strength(function(l){ return (DIST[l.relation]||DIST.contains).s; }))
    .force("charge", d3.forceManyBody().strength(function(d){ return CHARGE[d.kind]; }))
    .force("collide", d3.forceCollide().radius(function(d){ return baseR(d)+PAD[d.kind]; }).strength(0.95))
    .force("x", d3.forceX(function(d){ return fxTarget(d); }).strength(0.12))
    .alphaDecay(0.022);

  function fxTarget(d){
    if(mode!=="v1") return 0;
    if(d.kind==="claim"||d.kind==="cluster"){
      if(d.side==="positive") return -420;
      if(d.side==="negative") return 420;
    }
    return 0;
  }

  // ---- draw ----
  var selLink = gLinks.selectAll("line").data(links).join("line")
    .attr("class", function(l){ return "cm-link"; })
    .attr("stroke", function(l){ return LINK_C[l.relation]||LINK_C.contains; })
    .attr("stroke-width", function(l){ return LINK_W[l.relation]||LINK_W.contains; })
    .attr("stroke-dasharray", function(l){
      if(l.relation==="bridge") return "7,5";
      if(l.relation==="rebuts") return "5,4";
      return null;
    });
  var emphMoved = selLink.filter(function(l){ return l.relation==="rebuts"; }).remove();
  emphMoved.each(function(){ gEmph.node().appendChild(this); });
  selLink = gLinks.selectAll("line").merge(emphMoved);
  selLink.append("title").text(function(l){
    if(l.relation!=="rebuts") return l.relation;
    var s=nodeById[l.source.id||l.source], t=nodeById[l.target.id||l.target];
    return "rebuts：跨议题矛盾\n"+(s?s.fullLabel:"")+"\n↔\n"+(t?t.fullLabel:"");
  });

  var selRing = gRings.selectAll("circle").data([0]).join("circle")
    .attr("fill","none").attr("stroke-width",1.6).style("display","none");
  var activeNode = null;

  var selNode = gNodes.selectAll("circle").data(nodes).join("circle")
    .attr("r", baseR).attr("fill", colorOf)
    .attr("stroke", strokeOf)
    .attr("stroke-width", function(d){ return d.kind==="cluster" ? 2 : d.kind==="topic" ? 1.6 : 0; })
    .style("cursor","pointer").call(drag(sim));

  var selLabel = gLabels.selectAll("text").data(nodes).join("text")
    .attr("text-anchor","middle")
    .attr("class", function(d){
      return d.kind==="cluster" ? "node-label cluster-label" : (d.kind==="topic" ? "node-label topic-label" : "node-label claim-label");
    })
    .text(function(d){ return d.kind==="claim" ? "" : trunc(d.label, 20); })
    .attr("dy", function(d){ return baseR(d)+13; });

  function drag(simulation){
    return d3.drag()
      .on("start", function(e,d){ if(!e.active) simulation.alphaTarget(0.45).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag", function(e,d){ d.fx=e.x; d.fy=e.y; })
      .on("end", function(e,d){ if(!e.active) simulation.alphaTarget(0); /* 松手保持钉住：拖到哪固定到哪 */ });
  }

  sim.on("tick", function(){
    selLink
      .attr("x1",function(l){return l.source.x;}).attr("y1",function(l){return l.source.y;})
      .attr("x2",function(l){return l.target.x;}).attr("y2",function(l){return l.target.y;});
    selNode.attr("cx",function(d){return d.x;}).attr("cy",function(d){return d.y;});
    selLabel.attr("x",function(d){return d.x;}).attr("y",function(d){return d.y;});
    if(activeNode){
      selRing.attr("cx",activeNode.x).attr("cy",activeNode.y).attr("r",baseR(activeNode)+6);
    }
  });

  svg.call(d3.zoom().scaleExtent([0.25,3]).on("zoom", function(e){ g.attr("transform", e.transform); }));

  // ---- highlight & panel ----
  var pinned = null;
  function highlightSet(d){
    var s = {}; s[d.id]=1;
    links.forEach(function(l){
      var a=l.source.id||l.source, b=l.target.id||l.target;
      if(a===d.id) s[b]=1; if(b===d.id) s[a]=1;
    });
    return s;
  }
  function applyHighlight(d){
    activeNode = d || null;
    if(!d){
      selRing.style("display","none");
      selNode.attr("opacity",1);
      selLabel.attr("opacity",function(n){return n.kind==="claim"?0:1;})
        .text(function(n){ return n.kind==="claim" ? "" : trunc(n.label,20); });
      selLink.classed("cm-dim",false).classed("cm-lit",false); return;
    }
    selRing.style("display",null)
      .attr("cx",d.x).attr("cy",d.y).attr("r",baseR(d)+6)
      .attr("stroke", d.kind==="cluster" ? "#e8a33d" : "#0f6fe5");
    var s = highlightSet(d);
    selNode.attr("opacity", function(n){ return s[n.id]?1:0.14; });
    selLabel.attr("opacity", function(n){ return s[n.id]?1:0; })
      .text(function(n){
        if(n.kind==="claim") return s[n.id] ? trunc(n.fullLabel,22) : "";
        return trunc(n.label,20);
      });
    selLink.classed("cm-dim", function(l){
      var a=l.source.id||l.source, b=l.target.id||l.target;
      return !(s[a]&&s[b]);
    }).classed("cm-lit", function(l){
      var a=l.source.id||l.source, b=l.target.id||l.target;
      return s[a]&&s[b];
    });
  }
  function chipsForClaim(n){
    var h = "";
    var cls = n.side==="positive"?"pos":(n.side==="negative"?"neg":"");
    h += '<span class="chip '+cls+'">v1 立场：'+n.side+'</span>';
    h += '<span class="chip">理由类型：'+(n.reasonType||"")+'</span>';
    if(mode==="derived"){
      var c = campOf(n);
      var cc = c==="A"?"campA":(c==="B"?"campB":"");
      h += '<span class="chip '+cc+'">派生阵营：'+c+'</span>';
      if(DATA.claimComp[n.id]){
        var meta = DATA.compMeta.filter(function(m){return m.component===DATA.claimComp[n.id];})[0];
        if(meta) h += '<span class="chip">分量'+meta.component+' · balance='+meta.balance+' · v1一致率='+meta.v1SideAgreement.toFixed(2)+'</span>';
      }
    }
    return h;
  }
  function showPanel(d){
    var p = document.getElementById("panel");
    var h = "";
    if(d.kind==="claim"){
      h += '<h2>'+d.fullLabel+'</h2>';
      h += '<div class="chips">'+chipsForClaim(d)+'</div>';
      h += '<div class="meta">作者：'+(d.author||"—")+' · 赞 '+(d.votes||0)+'<br>所属议题：'+trunc(nodeById[d.topicId]?nodeById[d.topicId].fullLabel:"",60)+'</div>';
      h += '<p style="margin-top:8px"><a href="'+d.url+'" target="_blank">查看知乎原文 ↗</a></p>';
    } else if(d.kind==="topic"){
      h += '<h2>'+d.fullLabel+'</h2>';
      var claims = nodes.filter(function(n){return n.kind==="claim"&&n.topicId===d.id;});
      h += '<div class="meta">论点数：'+claims.length+'</div><ul>';
      claims.forEach(function(c){ h += '<li data-id="'+c.id+'">'+trunc(c.fullLabel,44)+'</li>'; });
      h += '</ul>';
    } else {
      h += '<h2>主张簇：'+d.label+'</h2>';
      h += '<div class="chips"><span class="chip">'+ (d.summary||"") +'</span></div>';
      var touched = {};
      DATA.edges.forEach(function(e){ if(e.relation==="bridge"&&e.source===d.id) touched[e.target]=1; });
      h += '<div class="meta">缝合 '+Object.keys(touched).length+' 个议题 · 成员边 '+d.weight+'</div><ul>';
      nodes.filter(function(n){return n.kind==="claim";}).forEach(function(c){
        var has = DATA.edges.some(function(e){return e.relation==="member"&&e.source===c.id&&e.target===d.id;});
        if(has) h += '<li data-id="'+c.id+'">'+trunc(c.fullLabel,44)+'</li>';
      });
      h += '</ul>';
    }
    p.innerHTML = h; p.style.display = "block";
    p.querySelectorAll("li[data-id]").forEach(function(li){
      li.addEventListener("click", function(){
        var n = nodeById[li.getAttribute("data-id")];
        pinned = n; showPanel(n); applyHighlight(n);
      });
    });
  }
  selNode.on("pointerover", function(e,d){ applyHighlight(d); showPanel(d);
    if(d.kind==="claim") selLabel.filter(function(n){return n.id===d.id;}).text(trunc(d.fullLabel,26)); });
  selNode.on("pointerout", function(e,d){
    selLabel.filter(function(n){return n.kind==="claim";}).text("");
    if(pinned){ applyHighlight(pinned); showPanel(pinned); } else { applyHighlight(null); document.getElementById("panel").style.display="none"; }
  });
  selNode.on("click", function(e,d){ e.stopPropagation(); pinned = d; showPanel(d); });
  selNode.on("dblclick", function(e,d){ e.stopPropagation(); d.fx=null; d.fy=null; sim.alpha(0.3).restart(); });
  svg.on("click", function(){ pinned = null; applyHighlight(null); document.getElementById("panel").style.display="none"; });

  // ---- mode switch ----
  function setMode(m){
    mode = m;
    document.getElementById("mode-v1").classList.toggle("active", m==="v1");
    document.getElementById("mode-derived").classList.toggle("active", m==="derived");
    selNode.transition().duration(300).attr("fill", colorOf);
    sim.force("x", d3.forceX(fxTarget).strength(m==="v1"?0.12:0));
    sim.alpha(0.5).restart();
    var cap = document.getElementById("caption");
    if(m==="v1"){
      cap.innerHTML = "v1 现状：颜色 = LLM 判的 side（相对各题隐含主流方向，有参照系歧义）；左右分翼由 forceX ±420 硬推。";
    } else {
      cap.innerHTML = "派生阵营（实验）：颜色 = 符号图二分（same-claim 相吸 / rebuts 相斥，纯图算法零 LLM）。无立场轴：位置完全由力学自然形成，不硬推左右。仅 2 个分量被极化，25/36 论点合理中性。";
    }
    renderLegend();
    if(pinned) showPanel(pinned);
  }
  document.getElementById("mode-v1").addEventListener("click", function(){ setMode("v1"); });
  document.getElementById("mode-derived").addEventListener("click", function(){ setMode("derived"); });

  function renderLegend(){
    var lg = document.getElementById("legend");
    if(mode==="v1"){
      lg.innerHTML = '<span class="dot" style="background:#0f6fe5"></span>正方主张簇 &nbsp;<span class="dot" style="background:#d9574d"></span>反方主张簇 &nbsp;<span class="dot" style="background:#64748b"></span>中性簇<br>'
        + '<span class="dot" style="background:#111827"></span>议题 &nbsp;<span class="dot" style="background:#7fb0f2"></span>正方论点 &nbsp;<span class="dot" style="background:#eda49c"></span>反方论点 &nbsp;<span class="dot" style="background:#a8b6c8"></span>中性<br>'
        + '<span class="ln g"></span>缝合线（跨议题共享主张） &nbsp;<span class="ln r"></span>rebuts 跨议题矛盾';
    } else {
      lg.innerHTML = '<span class="dot" style="background:#64748b"></span>主张簇（簇级派生未定） &nbsp;<span class="dot" style="background:#111827"></span>议题<br>'
        + '<span class="dot" style="background:#0f6fe5"></span>派生阵营 A &nbsp;<span class="dot" style="background:#d9574d"></span>阵营 B &nbsp;<span class="dot" style="background:#a8b6c8"></span>中性（25/36）<br>'
        + '<span class="ln g"></span>缝合线 &nbsp;<span class="ln r"></span>rebuts &nbsp;A/B 对称命名，不代表正反输赢';
    }
  }
  renderLegend();

  // ---- funnel list ----
  var fl = document.getElementById("funnel-list");
  var inMap = {}; nodes.forEach(function(n){ if(n.kind==="topic") inMap["zh-"+n.id.replace("zh-","")]=1; });
  function isKnown(title){
    return DATA.gatedRows && nodes.some(function(n){ return n.kind==="topic" && (n.fullLabel===title || n.fullLabel.indexOf(title.slice(0,12))>=0); });
  }
  var rows = DATA.gatedRows.slice().sort(function(a,b){ return (a.verdict==="放行"===b.verdict==="放行") ? 0 : (a.verdict==="放行"?-1:1); });
  var html2 = "";
  rows.forEach(function(r){
    html2 += '<div class="frow"><span class="vb '+(r.verdict==="放行"?"pass":"rej")+'">'+r.verdict+'</span>'
      + '<span class="vb '+(r.band==="gray"?"gray":"band")+'">'+(r.band==="gray"?"灰带·LLM":"规则带")+'</span>'
      + (isKnown(r.title)?'<span class="vb inmap">已在图</span>':"")
      + '<span class="t" title="'+(r.note||"").replace(/"/g,"")+'">'+r.title+'</span></div>';
  });
  fl.innerHTML = html2;
  document.getElementById("funnel-toggle").addEventListener("click", function(){
    fl.classList.toggle("open");
    this.textContent = (fl.classList.contains("open")?"▾":"▸") + this.textContent.slice(1);
  });
})();
</script>
</body>
</html>
