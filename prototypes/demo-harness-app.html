<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>demo-harness-app</title></head>
<body>
<iframe id="f" src="zhengming-app.html" style="width:1280px;height:820px"></iframe>
<pre id="report">RUNNING</pre>
<script>
const f=document.getElementById('f');
f.onload=async()=>{
  try{
    const d=f.contentDocument;
    await new Promise(r=>setTimeout(r,900));
    d.getElementById('vb-room').click();          // 切到实时辩论间 → Room.init()
    await new Promise(r=>setTimeout(r,1900));     // 匹配动画 1s + 余量
    d.getElementById('m-demo').click();           // 真实点击自动演示
    await new Promise(r=>setTimeout(r,26000));
    const stages=d.getElementById('stages').textContent.replace(/\s+/g,' ').trim();
    const maskShow=d.getElementById('room-mask').classList.contains('show');
    const mpRows=[...d.querySelectorAll('#mp-list .mrow')].map(x=>x.textContent.replace(/\s+/g,'')).join(' | ');
    const radar=d.querySelector('#radar-box svg')!==null;
    const err=(/演示中断/.test(d.getElementById('stage').textContent))?d.getElementById('stage').textContent.match(/演示中断[^（]*/)[0]:'none';
    document.getElementById('report').textContent=JSON.stringify({
      finalStage:stages, maskShow, mpRows, radar, demoError:err
    },null,1);
  }catch(e){document.getElementById('report').textContent='HARNESS-ERR '+e.message;}
};
</script>
</body>
</html>
